[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finehelper-core"
version = "0.1.0"
description = "Shared domain, storage, dataset pipeline, and training backends for Finehelper"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "motor>=3.6",
  "pymongo>=4.9",
  "cryptography>=42.0",
  "boto3>=1.34",
  "httpx>=0.27",
  "openai>=1.40",
  "orjson>=3.10",
  "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "structlog>=24.1",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=2.0",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]
chain = ["web3>=6.0"]

[tool.setuptools.packages.find]
include = ["finehelper_core*"]
