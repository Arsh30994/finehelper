# https://render.com/schema/render.yaml.json
projects:
  - name: finehelper
    environments:
      - name: production
        services:
          - type: keyvalue
            name: finehelper-kv
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList:
              - source: 0.0.0.0/0
                description: allow Render private network and workers

          - type: web
            name: finehelper-api
            runtime: python
            plan: starter
            region: oregon
            buildCommand: pip install -e packages/core -e apps/api
            startCommand: uvicorn finehelper_api.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /healthz
            envVars:
              - fromGroup: finehelper-secrets
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_DB
                value: finehelper
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: finehelper-kv
                  property: connectionString
              - key: FH_EMBEDDED_WORKER
                value: "0"
              - key: WEB_ORIGIN
                sync: false
              - key: API_PUBLIC_URL
                sync: false
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: PYTHONUNBUFFERED
                value: "1"

          - type: worker
            name: finehelper-cpu
            runtime: python
            plan: starter
            region: oregon
            buildCommand: pip install -e packages/core -e apps/api
            startCommand: python workers/cpu/main.py
            maxShutdownDelaySeconds: 300
            envVars:
              - fromGroup: finehelper-secrets
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_DB
                value: finehelper
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: finehelper-kv
                  property: connectionString
              - key: FH_EMBEDDED_WORKER
                value: "0"
              - key: S3_ENDPOINT_URL
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: PYTHONUNBUFFERED
                value: "1"

envVarGroups:
  - name: finehelper-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_KEY
        generateValue: true
