services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finehelper
      POSTGRES_PASSWORD: finehelper
      POSTGRES_DB: finehelper
    ports:
      - "5432:5432"
    volumes:
      - finehelper_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"

volumes:
  finehelper_pg:
